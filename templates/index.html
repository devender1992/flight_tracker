{% extends 'base.html' %}

{% block content %}
<div class="rowjustify-content-center">
    <div class="col-lg-8 mx-auto text-center mb-5">
        <h1 class="display-4 fw-bold text-white mb-3">Track Your Journey</h1>
        <p class="lead text-white-50">Find flights or check real-time status instantly.</p>
    </div>
</div>

<div class="row g-4 justify-content-center">
    <!-- Search Flights Card -->
    <div class="col-md-5">
        <div class="glass-card p-4 h-100">
            <h3 class="fw-bold mb-4 text-white">Search Flights</h3>
            <form action="/search" method="get">
                <div class="mb-3">
                    <label class="form-label text-white-50">Origin (IATA Code)</label>
                    <input type="text" name="origin" class="form-control form-control-lg glass-input"
                        placeholder="e.g. JFK" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-white-50">Destination (IATA Code)</label>
                    <input type="text" name="destination" class="form-control form-control-lg glass-input"
                        placeholder="e.g. LHR" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Find Flights</button>
            </form>
        </div>
    </div>

    <!-- Check Status Card -->
    <div class="col-md-5">
        <div class="glass-card p-4 h-100">
            <h3 class="fw-bold mb-4 text-white">Flight Status</h3>
            <form action="/status" method="get">
                <div class="mb-3">
                    <label class="form-label text-white-50">Flight Number</label>
                    <input type="text" name="flight_number" class="form-control form-control-lg glass-input"
                        placeholder="e.g. AA100">
                </div>
                <div class="mt-4 pt-1"></div> <!-- Spacer to align buttons roughly -->
                <div class="mb-4 d-none d-md-block" style="height: 38px;"></div> <!-- Visual balancing -->
                <button type="submit" class="btn btn-outline-light btn-lg w-100 fw-bold">Check Status</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
